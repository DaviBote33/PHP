<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-5 bg-light">

    <div class="container bg-white p-4 shadow-sm rounded-0">
        <form class="row g-2">

            <!-- Linha 1 -->
            <div class="col-md-1 mb-2">
                <label class="form-label fw-bold mb-1">Código</label>
                <input type="text" class="form-control rounded-0 w-50" value="45" disabled>
            </div>

            <div class="col-md-5 mb-2">
                <label class="form-label fw-bold mb-1">Nome</label>
                <input type="text" class="form-control rounded-0 w-75" placeholder="Nome completo">
            </div>

            <div class="col-md-4 mb-2">
                <label class="form-label fw-bold mb-1">E-mail</label>
                <input type="email" class="form-control rounded-0 w-75" placeholder="exemplo@email.com">
            </div>

            <div class="col-md-2 mb-2">
                <label class="form-label fw-bold mb-1">CPF</label>
                <input type="text" class="form-control rounded-0 w-75" placeholder="Digite o CPF">
            </div>

            <!-- Linha 2 -->
            <div class="col-md-2 mb-2">
                <label class="form-label fw-bold mb-1">Celular</label>
                <input type="text" class="form-control rounded-0 w-75" placeholder="Número celular">
            </div>

            <div class="col-md-2 mb-2">
                <label class="form-label fw-bold mb-1">Telefone</label>
                <input type="text" class="form-control rounded-0 w-75" placeholder="Telefone fixo">
            </div>

            <div class="col-md-2 mb-2">
                <label class="form-label fw-bold mb-1">CEP</label>
                <input type="text" class="form-control rounded-0 w-75" placeholder="00000-000">
            </div>

            <div class="col-md-3 mb-2">
                <label class="form-label fw-bold mb-1">Endereço</label>
                <input type="text" class="form-control rounded-0 w-50" placeholder="Rua, avenida...">
            </div>

            <div class="col-md-1 mb-2">
                <label class="form-label fw-bold mb-1">Nº</label>
                <input type="text" class="form-control rounded-0 w-50" placeholder="Nº">
            </div>

            <div class="col-md-2 mb-2">
                <label class="form-label fw-bold mb-1">Bairro</label>
                <input type="text" class="form-control rounded-0" placeholder="Nome do bairro">
            </div>

            <!-- Linha 3 -->
            <div class="col-md-4 mb-2">
                <label class="form-label fw-bold mb-1">Cidade</label>
                <input type="text" class="form-control rounded-0 w-75" placeholder="Nome da cidade">
            </div>

            <div class="col-md-1 mb-2">
                <label class="form-label fw-bold mb-1">UF</label>
                <input type="text" class="form-control rounded-0 w-50" placeholder="UF">
            </div>

            <div class="col-md-2 mb-2">
                <label class="form-label fw-bold mb-1">Status</label>
                <select class="form-select rounded-0 w-75">
                    <option selected>Selecione</option>
                    <option>Ativo</option>
                    <option>Inativo</option>
                </select>
            </div>

            <!-- Botões -->
            <div class="col-12 text-end mt-4">
                <button type="reset" class="btn btn-secondary rounded-0">
                    Limpar
                </button>

                <button type="submit" class="btn btn-primary rounded-0">
                    Continuar
                </button>
            </div>

        </form>
    </div>

</body>
</html>
