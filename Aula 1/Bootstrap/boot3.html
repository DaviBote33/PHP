<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-5 bg-light">

    <div class="container bg-white p-5 shadow-sm" style="max-width: 900px;">

        <h2 class="text-center mb-4 fw-normal text-secondary">Partner Form</h2>

        <form>

            <div class="row mb-3 align-items-center">
                <div class="col-md-2">
                    <label class="form-label fw-bold mb-0">Partner Name</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control" placeholder="Partner name">
                </div>

                <div class="col-md-2 text-md-end">
                    <label class="form-label fw-bold mb-0">Email</label>
                </div>
                <div class="col-md-4">
                    <input type="email" class="form-control" placeholder="email@exemplo.com">
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <div class="col-md-2">
                    <label class="form-label fw-bold mb-0">Legal Name</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control" placeholder="Nome legal">
                </div>

                <div class="col-md-2 text-md-end">
                    <label class="form-label fw-bold mb-0">Mobile</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control" placeholder="Telefone">
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <div class="col-md-2">
                    <label class="form-label fw-bold mb-0">Address</label>
                </div>
                <div class="col-md-10">
                    <textarea class="form-control" rows="3" placeholder="Digite o endereço"></textarea>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <div class="col-md-2">
                    <label class="form-label fw-bold mb-0">Start Date</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control" placeholder="Data inicial">
                </div>

                <div class="col-md-2 text-md-end">
                    <label class="form-label fw-bold mb-0">Expiry Date</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control" placeholder="Data final">
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <div class="col-md-2">
                    <label class="form-label fw-bold mb-0">Minimum Amount</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control" placeholder="Valor mínimo">
                </div>

                <div class="col-md-2 text-md-end">
                    <label class="form-label fw-bold mb-0">Maximum Amount</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control" placeholder="Valor máximo">
                </div>
            </div>

            <div class="row mb-4 align-items-center">
                <div class="col-md-2">
                    <label class="form-label fw-bold mb-0">Interest Rate</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control" placeholder="Taxa de juros">
                </div>

                <div class="col-md-2 text-md-end">
                    <label class="form-label fw-bold mb-0">Deposit Amount</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control" placeholder="Valor do depósito">
                </div>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-success px-4">
                    Save
                </button>
            </div>

        </form>

    </div>

</body>
</html>
